<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="440" height="520" style="background: transparent;">
  <defs>
    <linearGradient id="asciiBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    .terminal-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.2px;
      rx: 10px;
    }
    .terminal-header {
      fill: url(#headerGrad);
      stroke: #30363d;
      stroke-width: 1px;
    }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #8b949e;
      letter-spacing: 0.3px;
    }
    .cmd-text {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      fill: #7ee787;
      font-weight: 500;
    }
    .cmd-prompt {
      fill: #58a6ff;
    }
    .cmd-arg {
      fill: #d2a8ff;
    }
    
    .ascii-text {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 9.8px;
      font-weight: 700;
      fill: #58a6ff;
      letter-spacing: 0.2px;
      white-space: pre;
    }
    
    @keyframes revealRow {
      0% {
        opacity: 0;
        transform: translateY(3px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .ascii-row {
      opacity: 0;
      animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }
    
    @keyframes fadeInStatus {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    .status-line {
      opacity: 0;
      animation: fadeInStatus 0.4s ease-out forwards;
      animation-delay: 1.46s;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #8b949e;
    }
    .status-ok {
      fill: #3fb950;
      font-weight: 700;
    }
    .status-dim {
      fill: #6e7681;
    }
    
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: cursorBlink 1s infinite;
      fill: #58a6ff;
    }

    .r-0 { animation-delay: 0.000s; }
      .r-1 { animation-delay: 0.042s; }
      .r-2 { animation-delay: 0.084s; }
      .r-3 { animation-delay: 0.126s; }
      .r-4 { animation-delay: 0.168s; }
      .r-5 { animation-delay: 0.210s; }
      .r-6 { animation-delay: 0.252s; }
      .r-7 { animation-delay: 0.294s; }
      .r-8 { animation-delay: 0.336s; }
      .r-9 { animation-delay: 0.378s; }
      .r-10 { animation-delay: 0.420s; }
      .r-11 { animation-delay: 0.462s; }
      .r-12 { animation-delay: 0.504s; }
      .r-13 { animation-delay: 0.546s; }
      .r-14 { animation-delay: 0.588s; }
      .r-15 { animation-delay: 0.630s; }
      .r-16 { animation-delay: 0.672s; }
      .r-17 { animation-delay: 0.714s; }
      .r-18 { animation-delay: 0.756s; }
      .r-19 { animation-delay: 0.798s; }
      .r-20 { animation-delay: 0.840s; }
      .r-21 { animation-delay: 0.882s; }
      .r-22 { animation-delay: 0.924s; }
      .r-23 { animation-delay: 0.966s; }
      .r-24 { animation-delay: 1.008s; }
      .r-25 { animation-delay: 1.050s; }
      .r-26 { animation-delay: 1.092s; }
      .r-27 { animation-delay: 1.134s; }
      .r-28 { animation-delay: 1.176s; }
      .r-29 { animation-delay: 1.218s; }
  </style>

  <!-- Main Card Container -->
  <rect x="1" y="1" width="438" height="518" class="terminal-bg" />

  <!-- Window Header Bar -->
  <path d="M 1,11 A 10,10 0 0,1 11,1 L 429,1 A 10,10 0 0,1 439,11 L 439,36 L 1,36 Z" class="terminal-header" />
  
  <!-- Window Control Buttons -->
  <circle cx="18" cy="18" r="5.5" class="dot-red" />
  <circle cx="34" cy="18" r="5.5" class="dot-yellow" />
  <circle cx="50" cy="18" r="5.5" class="dot-green" />

  <!-- Header Title -->
  <text x="220" y="22" text-anchor="middle" class="title-text">johnsikder312-spec@avatar: ~ (monochrome.sh)</text>

  <!-- Terminal Command Prompt -->
  <g transform="translate(22, 56)">
    <text y="0" class="cmd-text">
      <tspan class="cmd-prompt">johnsikder312-spec:~$</tspan> ./render-portrait <tspan class="cmd-arg">--ascii --freeze</tspan>
    </text>
  </g>

