<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" width="540" height="520" style="background: transparent;">
  <defs>
    <linearGradient id="neofetchBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <linearGradient id="neoHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    .terminal-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.2px;
      rx: 10px;
    }
    .terminal-header {
      fill: url(#neoHeaderGrad);
      stroke: #30363d;
      stroke-width: 1px;
    }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #8b949e;
      letter-spacing: 0.3px;
    }
    .cmd-text {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      fill: #7ee787;
      font-weight: 500;
    }
    .cmd-prompt {
      fill: #58a6ff;
    }
    .cmd-arg {
      fill: #d2a8ff;
    }

    @keyframes slideFadeIn {
      0% {
        opacity: 0;
        transform: translateX(-10px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .neo-line {
      opacity: 0;
      animation: slideFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
    }

    .neo-header-user {
      fill: #58a6ff;
      font-weight: 700;
      font-size: 13px;
    }
    .neo-header-at {
      fill: #8b949e;
      font-weight: 600;
      font-size: 13px;
    }
    .neo-header-host {
      fill: #3fb950;
      font-weight: 700;
      font-size: 13px;
    }
    .neo-sep {
      fill: #30363d;
      font-weight: 600;
      font-size: 11px;
    }
    .neo-key {
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .neo-val {
      fill: #e6edf3;
      font-weight: 400;
    }

    @keyframes fadeInPalette {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .color-palette-group {
      opacity: 0;
      animation: fadeInPalette 0.4s ease-out forwards;
      animation-delay: 0.95s;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: cursorBlink 1s infinite;
      fill: #3fb950;
    }

    .line-0 { animation-delay: 0.080s; }
    .line-1 { animation-delay: 0.150s; }
    .line-2 { animation-delay: 0.220s; }
    .line-3 { animation-delay: 0.290s; }
    .line-4 { animation-delay: 0.360s; }
    .line-5 { animation-delay: 0.430s; }
    .line-6 { animation-delay: 0.500s; }
    .line-7 { animation-delay: 0.570s; }
    .line-8 { animation-delay: 0.640s; }
    .line-9 { animation-delay: 0.710s; }
    .line-10 { animation-delay: 0.780s; }
  </style>

  <!-- Main Card Container -->
  <rect x="1" y="1" width="538" height="518" class="terminal-bg" />

  <!-- Window Header Bar -->
  <path d="M 1,11 A 10,10 0 0,1 11,1 L 529,1 A 10,10 0 0,1 539,11 L 539,36 L 1,36 Z" class="terminal-header" />
  
  <!-- Window Control Buttons -->
  <circle cx="18" cy="18" r="5.5" class="dot-red" />
  <circle cx="34" cy="18" r="5.5" class="dot-yellow" />
  <circle cx="50" cy="18" r="5.5" class="dot-green" />

  <!-- Header Title -->
  <text x="270" y="22" text-anchor="middle" class="title-text">johnsikder312-spec@terminal: ~ (neofetch)</text>

  <!-- Terminal Command Prompt -->
  <g transform="translate(24, 56)">
    <text y="0" class="cmd-text">
      <tspan class="cmd-prompt">johnsikder312-spec:~$</tspan> neofetch <tspan class="cmd-arg">--system --stats</tspan>
    </text>
  </g>

  <!-- Neofetch Body Lines -->
  <g class="neo-line line-0" transform="translate(24, 80)">
  <text class="neo-header-user">johnsikder312-spec</text>
  <text x="145" class="neo-header-at">@</text>
  <text x="160" class="neo-header-host">GitHub-Matrix</text>
</g>
    <g class="neo-line line-1" transform="translate(24, 98)">
  <text class="neo-sep">--------------------------------------------------</text>
</g>
    <g class="neo-line line-2" transform="translate(24, 122)">
  <text class="neo-key" style="fill: #ff7b72;">OS:</text>
  <text x="110" class="neo-val">GitHub Cloud Linux (x86_64)</text>
</g>
    <g class="neo-line line-3" transform="translate(24, 148)">
  <text class="neo-key" style="fill: #d2a8ff;">Host:</text>
  <text x="110" class="neo-val">GitHub Profile Matrix v2.4 (x86_64)</text>
</g>
    <g class="neo-line line-4" transform="translate(24, 174)">
  <text class="neo-key" style="fill: #79c0ff;">Role:</text>
  <text x="110" class="neo-val">Full-Stack Engineer &amp; AI Systems Architect</text>
</g>
    <g class="neo-line line-5" transform="translate(24, 200)">
  <text class="neo-key" style="fill: #7ee787;">Languages:</text>
  <text x="110" class="neo-val">Python, TypeScript, Go, Rust, C++, SQL</text>
</g>
    <g class="neo-line line-6" transform="translate(24, 226)">
  <text class="neo-key" style="fill: #ffa657;">Frameworks:</text>
  <text x="110" class="neo-val">React, Next.js, Node.js, FastAPI, TailwindCSS</text>
</g>
    <g class="neo-line line-7" transform="translate(24, 252)">
  <text class="neo-key" style="fill: #58a6ff;">Cloud/DevOps:</text>
  <text x="110" class="neo-val">Google Cloud, AWS, Docker, Kubernetes, GitHub Actions, Terraform</text>
</g>
    <g class="neo-line line-8" transform="translate(24, 278)">
  <text class="neo-key" style="fill: #d2a8ff;">Specialties:</text>
  <text x="110" class="neo-val">Agentic AI Workflows, Distributed Systems, High-Performance APIs, Data Pipelines</text>
</g>
    <g class="neo-line line-9" transform="translate(24, 304)">
  <text class="neo-key" style="fill: #7ee787;">Uptime:</text>
  <text x="110" class="neo-val">99.99% in flow state</text>
</g>
    <g class="neo-line line-10" transform="translate(24, 330)">
  <text class="neo-key" style="fill: #3fb950;">Status:</text>
  <text x="110" class="neo-val">🟢 Available for high-impact engineering &amp; open-source collaboration</text>
</g>

  <!-- ANSI Color Palette Display -->
  <g class="color-palette-group">
      <rect x="24" y="366" width="26" height="13" rx="3" fill="#484f58" />
      <rect x="56" y="366" width="26" height="13" rx="3" fill="#ff7b72" />
      <rect x="88" y="366" width="26" height="13" rx="3" fill="#3fb950" />
      <rect x="120" y="366" width="26" height="13" rx="3" fill="#d29922" />
      <rect x="152" y="366" width="26" height="13" rx="3" fill="#58a6ff" />
      <rect x="184" y="366" width="26" height="13" rx="3" fill="#bc8cff" />
      <rect x="216" y="366" width="26" height="13" rx="3" fill="#39c5cf" />
      <rect x="248" y="366" width="26" height="13" rx="3" fill="#b1bac4" />
      <rect x="24" y="383" width="26" height="13" rx="3" fill="#6e7681" />
      <rect x="56" y="383" width="26" height="13" rx="3" fill="#ffa198" />
      <rect x="88" y="383" width="26" height="13" rx="3" fill="#56d364" />
      <rect x="120" y="383" width="26" height="13" rx="3" fill="#e3b341" />
      <rect x="152" y="383" width="26" height="13" rx="3" fill="#79c0ff" />
      <rect x="184" y="383" width="26" height="13" rx="3" fill="#d2a8ff" />
      <rect x="216" y="383" width="26" height="13" rx="3" fill="#56d4dd" />
      <rect x="248" y="383" width="26" height="13" rx="3" fill="#f0f6fc" />
  </g>
</svg>