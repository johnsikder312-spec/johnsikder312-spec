  </g>

  <!-- Status / Frozen Line -->
  <g class="status-line">
    <text x="22" y="460.0">
      <tspan class="status-ok">[READY]</tspan> 52x30 ASCII RENDERED <tspan class="status-dim">| STATUS: FROZEN</tspan> <tspan class="cursor">_</tspan>
    </text>
  </g>
</svg>